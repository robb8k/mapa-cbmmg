name: Atualizar Ocorrencias CBMMG

on:
  schedule:
    # Executa a cada 2 horas de forma automatica
    - cron: '0 */2 * * *'
  # Permite disparar manualmente pelo painel
  workflow_dispatch:

jobs:
  coletar-e-atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Executar coletor.py
        run: python coletor.py

      - name: Salvar e publicar atualizacoes
        run: |
          git config --global user.name "Robo CBMMG"
          git config --global user.email "bot@github.actions"
          git add ocorrencias.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualizacao automatica de ocorrencias" && git push)
